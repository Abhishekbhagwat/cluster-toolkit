# Single-slice TPU v5p job with Kueue scheduling.
# Topology: 2x4x4 = 32 chips, 8 nodes (ct5p-hightpu-4t = 4 chips/node)
# Expected output: "Global device count: 32"

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: singleslice-job
  labels:
    kueue.x-k8s.io/queue-name: cluster-queue
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 4
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        parallelism: 8
        completions: 8
        backoffLimit: 0
        template:
          spec:
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
              cloud.google.com/gke-tpu-topology: 2x4x4
            containers:
            - name: jax-tpu
              image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
              ports:
              - containerPort: 8471
              - containerPort: 8080
              - containerPort: 8431
              securityContext:
                privileged: true
              command:
              - bash
              - -c
              - |
                python -c 'import jax; print("Global device count:", jax.device_count())'
                sleep 60
              resources:
                limits:
                  google.com/tpu: 4
