terraform_backend_defaults:
  type: gcs
  configuration:
    # The GCS bucket used for storing terraform state
    bucket: ai-infra-recipe-validation-tf-state

vars:
  # Your GCP Project ID
  project_id: ai-infra-recipe-validation

  # This should be unique across all of your Cluster
  # Toolkit Deployments.
  deployment_name: gke-tpu-v5p-kueue

  # The GCP Region used for this deployment.
  # example: us-east5
  region: us-east5

  # The GCP Zone used for this deployment.
  # example: us-east5-a
  zone: us-east5-a

  # The number of TPU slices to create
  num_slices: 1

  # Machine type
  machine_type: ct5p-hightpu-4t

  # The TPU placement topology for pod slice node pool.
  tpu_topology: 2x4x4

  # The number of nodes to be created in each nodepool
  # For TPUs, static_node_count should be num of chips based on topology divided by num chips for the machine type
  # Reference: https://cloud.google.com/tpu/docs/v5p
  static_node_count: 8

  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr: 0.0.0.0/0

  # The name of the compute engine reservation of TPU v5p nodes
  # reservation:
  spot: true

  # CPU Node Pool Configuration (uncomment when enabling Pathways)
  cpu_node_pool_machine_type: "n2-standard-64"
  cpu_node_pool_node_count: 2
  cpu_node_pool_vcpus_per_node: 64
  cpu_node_pool_memory_gb_per_node: 256
